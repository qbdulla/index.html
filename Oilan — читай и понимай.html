@import url('https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap');
.oi-root{font-family:'Onest',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.oi-root *{box-sizing:border-box;min-width:0}
.oi-h{letter-spacing:-0.035em;line-height:1.02;text-wrap:balance}
.oi-marquee{display:flex;width:max-content;animation:oi-mq 38s linear infinite}
@keyframes oi-mq{to{transform:translateX(-50%)}}
.oi-float{animation:oi-float 5s ease-in-out infinite}
@keyframes oi-float{50%{transform:translateY(-10px)}}
.oi-blink{animation:oi-blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes oi-blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.oi-pop{animation:oi-pop .28s cubic-bezier(.2,.9,.3,1.3)}
@keyframes oi-pop{from{opacity:0;transform:translateY(6px) scale(.96)}}
.oi-mark{background:linear-gradient(transparent 12%,rgba(232,99,67,.32) 12%,rgba(232,99,67,.32) 88%,transparent 88%)}
.oi-mark-ok{background:linear-gradient(transparent 12%,rgba(42,157,143,.3) 12%,rgba(42,157,143,.3) 88%,transparent 88%)}
.oi-mark-no{background:linear-gradient(transparent 12%,rgba(24,21,18,.1) 12%,rgba(24,21,18,.1) 88%,transparent 88%);text-decoration:line-through;text-decoration-color:rgba(24,21,18,.35)}
.oi-root textarea,.oi-root input,.oi-root select{font-size:16px}
.oi-root :focus-visible{outline:2px solid #E86343;outline-offset:2px}
.oi-scroll{overflow-x:auto;scrollbar-width:thin}
@media (prefers-reduced-motion:reduce){.oi-marquee,.oi-float,.oi-blink,.oi-pop{animation:none}}
